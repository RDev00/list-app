name: Flutter Build Multiplatform

on:
  push:
    branches: [ flutter-app ]
  pull_request:
    branches: [ flutter-app ]

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target: [android, linux, windows, macos]
        include:
          - target: android
            os: ubuntu-latest
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java (Android only)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Desktop Support
        run: |
          flutter config --enable-linux-desktop
          flutter config --enable-windows-desktop
          flutter config --enable-macos-desktop

      - name: Build App
        run: |
          if [ "${{ matrix.target }}" == "android" ]; then
            flutter build apk --release
          elif [ "${{ matrix.target }}" == "linux" ]; then
            flutter build linux --release
          elif [ "${{ matrix.target }}" == "windows" ]; then
            flutter build windows --release
          elif [ "${{ matrix.target }}" == "macos" ]; then
            flutter build macos --release --no-codesign
          fi
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-build
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/linux/x64/release/bundle/
            build/windows/x64/runner/Release/
            build/macos/Build/Products/Release/*.app
