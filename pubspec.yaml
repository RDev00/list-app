name: cloudbook
description: "CloudBook es una aplicación para guardar notas de manera segura, usando encriptación de alto grado de manera end-to-end, de modo que nosotros no veremos nada de tu información completamente segura para ti."
publish_to: 'RavexCode'
version: 0.7.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  provider: ^6.1.5+1
  flutter_riverpod: 2.6.1
  json_serializable: ^6.13.0
  shared_preferences: ^2.5.4
  flutter_slidable: ^4.0.3
  url_launcher: ^6.3.2
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1


flutter:
  uses-material-design: true
